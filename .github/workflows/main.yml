name: Build Minecraft Mod

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build with Windows and Java 25
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Show Java version
        run: |
          java -version
          javac -version

      - name: Stop existing Gradle daemons
        working-directory: verity
        run: .\gradlew.bat --stop

      - name: Build mod
        working-directory: verity
        run: .\gradlew.bat clean build --no-daemon --stacktrace

      - name: Check generated JAR
        working-directory: verity
        run: |
          $jars = Get-ChildItem "build/libs/*.jar" |
            Where-Object { $_.Name -notlike "*-sources.jar" }

          if ($jars.Count -eq 0) {
            throw "Nenhum JAR do mod foi encontrado em build/libs."
          }

          $jars | Format-Table Name, Length

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: verity-mod-${{ github.sha }}
          path: |
            verity/build/libs/*.jar
            !verity/build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 30
